services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: alefdelta_mysql
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:-alef_delta_sacco}
      MYSQL_USER: ${DB_USER:-alefdelta_admin}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - alefdelta_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --log-bin-trust-function-creators=1
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Adminer - Database GUI
  # adminer:
  #   image: adminer:latest
  #   container_name: alefdelta_adminer
  #   restart: unless-stopped
  #   ports:
  #     - "8082:8080"
  #   networks:
  #     - alefdelta_network
  #   depends_on:
  #     mysql:
  #       condition: service_healthy
  #   environment:
  #     ADMINER_DEFAULT_SERVER: mysql

  # Backend API
  api:
    build:
      context: ./alef_delta_sacco_backend
      dockerfile: Dockerfile
    container_name: alefdelta_api
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    expose:
      - "4000"
    env_file:
      - ./alef_delta_sacco_backend/.env
    volumes:
      - ./alef_delta_sacco_backend/uploads:/app/uploads
    networks:
      - alefdelta_network
    depends_on:
      mysql:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Entrypoint script handles migrations

  # Frontend UI (Staff Portal)
  frontend:
    build:
      context: ./alef-delta-hub
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://sacco-api.alefdelta.com/api}
    container_name: alefdelta_frontend
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    expose:
      - "80"
    env_file:
      - ./alef-delta-hub/.env
    networks:
      - alefdelta_network
    depends_on:
      - api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Member Portal (Telegram Mini App UI)
  member_portal:
    build:
      context: ./alef_delta_sacco_member_portal
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://sacco-api.alefdelta.com/api}
    container_name: alefdelta_member_portal
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    expose:
      - "80"
    networks:
      - alefdelta_network
    depends_on:
      - api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional standalone proxy. Production uses the VPS-wide alef_erp_caddy
  # container, which joins alefdelta_network and owns ports 80/443.
  caddy:
    image: caddy:2-alpine
    container_name: alefdelta_caddy
    profiles:
      - standalone-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - alefdelta_network
    extra_hosts:
      # Lets Caddy reach services published on the host (e.g. Aelf_ERP stack on 4002/5176/7071)
      - "host.docker.internal:host-gateway"
    depends_on:
      - api
      - frontend
      - member_portal

volumes:
  mysql_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  alefdelta_network:
    name: alefdelta_network
    driver: bridge
